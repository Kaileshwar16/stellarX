<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Space Tracker</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
  html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; }
  #alertBox { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.5); color: white; padding: 10px; max-width: 300px; font-size: 14px; }
</style>
</head>
<body>

<button id="suggestBtn" style="position:absolute; top:80px; left:10px; z-index:100;">Suggest Launch</button>
<div id="launchBox" style="position:absolute; top:120px; left:10px; background:rgba(0,0,0,0.5); color:white; padding:10px;"></div>
<div id="cesiumContainer"></div>
<div id="alertBox">Loading alerts...</div>

<script>
const viewer = new Cesium.Viewer('cesiumContainer', {sceneMode: Cesium.SceneMode.SCENE3D, timeline: true, animation: true});
const entities = new Map();
let userOrbit; // store suggested orbit entity

// Suggest Launch button
document.getElementById('suggestBtn').onclick = async function() {
    const res = await fetch('/space-tracker/api/suggest-launch/');
    const data = await res.json();
    const box = document.getElementById('launchBox');

    if(data.error){
        box.innerText = data.error;
        return;
    }

    box.innerText = "Suggested safe orbit altitude: " + data.suggested_altitude_km + " km";

    // Draw orbit
    const radius = 6371 + data.suggested_altitude_km; // Earth radius + orbit
    const points = [];
    const deg2rad = Math.PI / 180;
    for(let lon=0; lon<=360; lon+=5){ // 5° steps
        const lat = data.inclination_deg || 0; // default equatorial
        const phi = lon * deg2rad;
        const theta = lat * deg2rad;
        const x = radius * Math.cos(theta) * Math.cos(phi);
        const y = radius * Math.cos(theta) * Math.sin(phi);
        const z = radius * Math.sin(theta);
        points.push(new Cesium.Cartesian3(x*1000, y*1000, z*1000)); // km -> m
    }

    // remove previous orbit if exists
    if(userOrbit) viewer.entities.remove(userOrbit);

    userOrbit = viewer.entities.add({
        name: 'Suggested Orbit',
        polyline: {
            positions: points,
            width: 2,
            material: Cesium.Color.GREEN
        }
    });
}

// Satellite fetching & updating
async function fetchSats(){
  const res = await fetch('/space-tracker/api/satellites/?limit=300');
  return await res.json();
}

function updateSats(data){
  const names = new Set(data.map(s=>s.name));
  for(const key of Array.from(entities.keys())){
    if(!names.has(key)){
      viewer.entities.remove(entities.get(key));
      entities.delete(key);
    }
  }
  data.forEach(s => {
    const pos = Cesium.Cartesian3.fromElements(s.x*1000, s.y*1000, s.z*1000);
    if(entities.has(s.name)){
      entities.get(s.name).position = pos;
    } else {
      const ent = viewer.entities.add({name:s.name, position: pos, point: {pixelSize:6}, label:{text:s.name, show:false}});
      entities.set(s.name, ent);
    }
  });
}

// Alerts
async function fetchAlerts(){
  const res = await fetch('/space-tracker/api/alerts/?th=5&limit=300');
  const a = await res.json();
  const box = document.getElementById('alertBox');
  if(a.length === 0) box.innerText = 'No close approaches detected (snapshot)';
  else box.innerHTML = a.slice(0,10).map(x=>`<div><b>${x.sat1}</b> ↔ <b>${x.sat2}</b> : ${x.distance_km} km</div>`).join('');
}

// Tick function
async function tick(){
  try{
    const sats = await fetchSats();
    updateSats(sats);
    await fetchAlerts();
  }catch(e){
    console.error(e);
  }
}

// Initial load + interval
tick();
setInterval(tick, 15000);
</script>
</body>
</html>
